name: Docker build and publish

on:
  release:
    types: [published]  # Only triggers when a release is published
  schedule:
    - cron: "17 2 * * 0" # Weekly multiarch validation and nightly tag refresh

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-publish-${{ github.event_name == 'release' && github.event.release.tag_name || 'weekly-nightly' }}
  cancel-in-progress: ${{ github.event_name == 'schedule' }}

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Build records duplicate data already available in the log and summary.
      DOCKER_BUILD_RECORD_UPLOAD: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/tagvico-ai
          tags: |
            type=schedule,pattern=nightly
            type=semver,pattern={{version}},enable=${{ github.event_name == 'release' }}
            # Prereleases get only their immutable semver tag. Keep :latest on
            # the newest stable release so unattended deployments never jump
            # to an alpha, beta, or release candidate.
            type=raw,value=latest,enable=${{ github.event_name == 'release' && !github.event.release.prerelease }}

      - name: Build and push release
        if: github.event_name == 'release'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha,scope=tagvico-docker-main
            type=gha

      - name: Build and push weekly nightly
        if: github.event_name == 'schedule'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha,scope=tagvico-docker-main
            type=gha
          cache-to: type=gha,scope=tagvico-docker-main,mode=max,ignore-error=true
